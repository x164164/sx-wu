<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北师大数学乐园 · 五年级上册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(135deg,#1a1a40 0%,#16213e 50%,#0f3460 100%);min-height:100vh;color:#fff;overflow-x:hidden}
#app{max-width:980px;margin:0 auto;padding:16px 16px 60px}
/* ===== 顶部 ===== */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border-radius:20px;border:1px solid rgba(255,255,255,.12);margin-bottom:18px;position:sticky;top:10px;z-index:50}
.topbar .logo{font-size:34px}
.topbar h1{font-size:20px;letter-spacing:1px}
.topbar .sub{font-size:12px;opacity:.7;margin-top:2px}
.back-btn{margin-left:auto;background:linear-gradient(135deg,#ff9f43,#ff6b6b);border:none;color:#fff;font-size:15px;font-weight:700;padding:10px 18px;border-radius:14px;cursor:pointer;box-shadow:0 4px 12px rgba(255,107,107,.35);transition:.2s}
.back-btn:hover{transform:translateY(-2px)}
.back-btn:disabled{opacity:.35;cursor:default;transform:none}
.star-pill{background:rgba(254,202,87,.15);border:1px solid rgba(254,202,87,.4);color:#feca57;padding:8px 14px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap}
/* ===== 首页 ===== */
.hero{text-align:center;padding:26px 10px 6px}
.hero .big{font-size:56px;animation:float 3s ease-in-out infinite}
.hero h2{font-size:26px;margin:8px 0 4px;text-shadow:0 4px 16px rgba(84,160,255,.5)}
.hero p{opacity:.75;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:22px}
.ucard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.ucard:hover{box-shadow:0 12px 32px rgba(0,0,0,.4);background:rgba(255,255,255,.1)}
.ucard .glow{position:absolute;inset:0;background:radial-gradient(circle at 20% 0%,var(--c) 0%,transparent 55%);opacity:.18;pointer-events:none}
.ucard .uicon{font-size:40px}
.ucard h3{font-size:19px;margin:8px 0 6px}
.ucard h3 .tag{font-size:11px;background:var(--c);padding:2px 10px;border-radius:99px;vertical-align:middle;margin-left:8px;color:#16213e}
.ucard .outline{font-size:13px;line-height:1.7;opacity:.8}
.ucard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}
.ucard .open{color:#7bed9f;font-weight:700}
.ucard .lock{color:#a4b0be}
.stars{color:#feca57;font-size:16px;letter-spacing:2px}
/* ===== 单元页 ===== */
.unit-head{border-radius:24px;padding:26px;margin-bottom:18px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
.unit-head .glow{position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,var(--c),transparent 60%);opacity:.25}
.unit-head h2{font-size:24px;display:flex;align-items:center;gap:10px}
.unit-head .outline{margin-top:10px;font-size:14px;line-height:1.9;background:rgba(0,0,0,.25);border-radius:14px;padding:12px 16px}
.lpath{display:flex;flex-direction:column;gap:12px}
.litem{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;cursor:pointer;transition:.2s}
/* 错题本 */
.wentry{margin:14px 0 6px;padding:16px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(255,107,107,.18),rgba(254,202,87,.12));border:2px solid rgba(255,107,107,.5);display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s;font-size:18px;font-weight:800}
.wentry:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(255,107,107,.25)}
.wentry .wico{font-size:38px}
.wentry .wcnt{margin-left:auto;background:#ff6b6b;color:#fff;border-radius:999px;padding:3px 14px;font-size:17px}
.wentry.empty{border-color:rgba(123,237,159,.4);background:rgba(123,237,159,.08);cursor:default}
.wentry.empty:hover{transform:none;box-shadow:none}
.wcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.wcard .wfrom{font-size:13px;opacity:.65;margin-bottom:6px}
.wcard .wq{font-size:16px;font-weight:700;line-height:1.6}
.wcard .wans{font-size:15px;margin-top:6px;color:#7bed9f}
.wcard .wwhy{font-size:14px;margin-top:6px;color:#feca57;line-height:1.5}
.wcard .wopts{font-size:14px;opacity:.85;margin-top:6px;line-height:1.7}
.wcard .wops{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
/* 思维导图 */
.mm-root{text-align:center;margin:18px 0 10px}
.mm-root-node{display:inline-block;background:linear-gradient(135deg,#feca57,#ff9f43);color:#16213e;font-size:22px;font-weight:800;padding:14px 32px;border-radius:20px;box-shadow:0 4px 20px rgba(254,202,87,.35)}
.mm-trunk{width:3px;height:24px;background:rgba(255,255,255,.25);margin:0 auto;border-radius:2px}
.mm-branches{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.mm-branch{position:relative;padding-left:26px}
.mm-branch::before{content:"";position:absolute;left:8px;top:0;bottom:10px;width:2px;background:rgba(255,255,255,.18);border-radius:1px}
.mm-branch::after{content:"";position:absolute;left:8px;top:22px;width:16px;height:2px;background:var(--c,#feca57);border-radius:1px}
.mm-unit{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-left:4px solid var(--c);border-radius:14px;overflow:hidden;transition:.2s}
.mm-unit-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.mm-unit-head:hover{background:rgba(255,255,255,.06)}
.mm-uico{font-size:26px}
.mm-uname{flex:1;text-align:left}
.mm-uname b{font-size:16px}
.mm-uname .mm-meta{font-size:12px;opacity:.6;margin-top:2px}
.mm-stars{font-size:13px;color:#feca57;letter-spacing:1px}
.mm-arrow{transition:.25s;font-size:14px;opacity:.6}
.mm-branch.open .mm-arrow{transform:rotate(90deg)}
.mm-body{display:none;padding:0 14px 12px}
.mm-branch.open .mm-body{display:block}
.mm-outline{font-size:13px;line-height:1.9;opacity:.85;background:rgba(0,0,0,.25);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.mm-lessons{display:flex;flex-direction:column;gap:6px}
.mm-lesson{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.05);border-radius:10px;font-size:14px;cursor:pointer;transition:.15s}
.mm-lesson:hover{background:rgba(255,255,255,.1)}
.mm-lesson .mm-lno{width:22px;height:22px;border-radius:7px;background:var(--c);color:#16213e;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mm-lesson .mm-lst{margin-left:auto;font-size:12px;color:#feca57;letter-spacing:1px;flex-shrink:0}
.litem:hover:not(.locked){background:rgba(255,255,255,.12)}
.litem .no{width:40px;height:40px;border-radius:12px;background:var(--c);color:#16213e;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.litem .lt{flex:1}
.litem .lt b{font-size:16px}
.litem .lt div{font-size:12px;opacity:.7;margin-top:3px}
.litem.locked{opacity:.5;cursor:default}
/* ===== 学习流程 ===== */
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.step{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#a4b0be}
.step.on{background:linear-gradient(135deg,#54a0ff,#5f27cd);color:#fff;box-shadow:0 4px 14px rgba(95,39,205,.45)}
.step.ok{background:rgba(123,237,159,.15);color:#7bed9f;border-color:rgba(123,237,159,.4)}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:24px;min-height:420px}
/* ===== 讲解舞台 ===== */
.stage{position:relative;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.15));border-radius:18px;min-height:300px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.teacher{position:absolute;left:14px;bottom:12px;font-size:46px;animation:float 2.6s ease-in-out infinite;z-index:3}
.bubble{position:absolute;left:70px;bottom:56px;max-width:72%;background:#fff;color:#2f3542;border-radius:16px;padding:10px 16px;font-size:14px;line-height:1.7;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:3}
.bubble:after{content:"";position:absolute;left:-8px;bottom:14px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
.ctrl button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;width:46px;height:46px;border-radius:50%;font-size:18px;cursor:pointer;transition:.2s}
.ctrl button:hover{background:rgba(255,255,255,.25);transform:scale(1.1)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:#feca57;transform:scale(1.3)}
.big-btn{display:block;margin:22px auto 0;background:linear-gradient(135deg,#1dd1a1,#10ac84);border:none;color:#fff;font-size:17px;font-weight:800;padding:14px 44px;border-radius:16px;cursor:pointer;box-shadow:0 6px 18px rgba(29,209,161,.4);transition:.2s}
.big-btn:hover{transform:translateY(-2px) scale(1.03)}
/* ===== 讲解动画元素 ===== */
.a-pop{animation:pop .55s cubic-bezier(.68,-.55,.27,1.55) both}
.a-up{animation:up .6s ease both}
.a-shake{animation:shake .5s}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(254,202,87,.6)}50%{box-shadow:0 0 26px rgba(254,202,87,1)}}
.emo{font-size:52px;display:inline-block;margin:4px}
.huge{font-size:56px;font-weight:900;color:#feca57;text-shadow:0 4px 20px rgba(254,202,87,.5);font-family:Consolas,monospace}
.eq{font-size:34px;font-weight:800;font-family:Consolas,monospace;background:rgba(0,0,0,.3);padding:12px 26px;border-radius:16px;letter-spacing:2px}
.eq .hl{color:#feca57}
.eq .ok{color:#7bed9f}
.tipbox{background:rgba(254,202,87,.12);border:1px dashed rgba(254,202,87,.5);border-radius:14px;padding:12px 18px;font-size:15px;line-height:1.8;margin-top:12px}
/* 竖式 */
.vdiv{display:inline-block;font-family:Consolas,monospace;font-size:26px;font-weight:700;background:rgba(0,0,0,.35);padding:16px 24px;border-radius:14px;line-height:1.5}
.vdiv .row{display:flex;justify-content:flex-end}
.vdiv .c{width:30px;text-align:center;position:relative}
.vdiv .q .c{border-bottom:3px solid #feca57}
.vdiv .new{color:#7bed9f}
.vdiv .hlc{color:#feca57;background:rgba(254,202,87,.15);border-radius:6px}
/* ===== 题目 ===== */
.qcard{margin-bottom:18px}
.qtitle{font-size:17px;line-height:1.8;margin-bottom:14px;font-weight:700}
.qtitle .qn{background:#54a0ff;border-radius:8px;padding:2px 10px;margin-right:8px;font-size:13px}
.opts{display:grid;gap:10px}
.opt{background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:13px 18px;font-size:16px;cursor:pointer;transition:.2s;text-align:left}
.opt:hover{border-color:#54a0ff;transform:translateX(4px)}
.opt.right{background:rgba(123,237,159,.2);border-color:#7bed9f}
.opt.wrong{background:rgba(255,107,107,.2);border-color:#ff6b6b;animation:shake .4s}
.judge-row{display:flex;gap:16px}
.judge-row .opt{flex:1;text-align:center;font-size:26px}
.qfeed{margin-top:10px;font-size:14px;min-height:22px;font-weight:700}
.qfeed.ok{color:#7bed9f}.qfeed.no{color:#ff6b6b}
/* ===== 键盘与填空 ===== */
.slots{display:flex;gap:8px;justify-content:center;margin:18px 0}
.slot{width:46px;height:56px;border-radius:12px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Consolas,monospace}
.slot.active{border-color:#feca57;animation:glowPulse 1.2s infinite}
.slot.dot{border:none;background:none;cursor:default;font-size:32px}
.keypad{display:grid;grid-template-columns:repeat(4,64px);gap:10px;justify-content:center;margin:14px 0}
.keypad button{height:52px;font-size:22px;font-weight:800;border-radius:12px;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:.15s;font-family:Consolas,monospace}
.keypad button:hover{background:#54a0ff;transform:scale(1.08)}
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:10px}
.mini-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;cursor:pointer;font-weight:700}
.mini-btn:hover{background:rgba(255,255,255,.25)}
.check-btn{background:linear-gradient(135deg,#feca57,#ff9f43);border:none;color:#5f27cd;padding:12px 34px;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 14px rgba(254,202,87,.4)}
.check-btn:hover{transform:scale(1.05)}
/* 循环小数游戏 */
.cyc-digits{display:flex;gap:4px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.cyc-digits .d{width:40px;height:50px;border-radius:10px;background:rgba(0,0,0,.35);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:Consolas,monospace;cursor:pointer;border:2px solid transparent}
.cyc-digits .d.sel{border-color:#feca57;background:rgba(254,202,87,.25);color:#feca57}
.cyc-digits .d.int{cursor:default;opacity:.85}
.cyc-digits .d.dotc{cursor:default;background:none}
/* ===== 结算 ===== */
.settle{text-align:center;padding:30px 10px}
.settle .cups{font-size:60px;letter-spacing:8px}
.settle h2{margin:14px 0 6px;font-size:26px}
.settle p{opacity:.8;line-height:1.9;font-size:15px}
.confetti{position:fixed;font-size:26px;top:-40px;z-index:99;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.foot{text-align:center;opacity:.5;font-size:12px;margin-top:34px;line-height:1.8}
/* ===== 几何网格游戏 ===== */
.mgrid{display:grid;gap:3px;justify-content:center}
.g6{grid-template-columns:repeat(6,40px)}
.g8{grid-template-columns:repeat(8,34px)}
.mcell{width:40px;height:40px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.g8 .mcell{width:34px;height:34px}
.mcell.given{background:linear-gradient(135deg,#54a0ff,#5f27cd);border-color:#74b9ff;cursor:default}
.mcell.pick{background:linear-gradient(135deg,#feca57,#ff9f43);border-color:#feca57;cursor:pointer}
.mcell.ghost{background:rgba(254,202,87,.12);border:2px dashed #feca57}
.mcell.block{background:linear-gradient(135deg,#1dd1a1,#10ac84);border-color:#7bed9f;box-shadow:0 0 8px rgba(29,209,161,.5)}
.mcell.art{background:linear-gradient(135deg,#f368e0,#ee5a6f);border-color:#f368e0;box-shadow:0 0 6px rgba(243,104,224,.5);cursor:pointer}
.mcell.axisL{border-right:2px dashed rgba(254,202,87,.9)}
.mcell.axisT{border-bottom:2px dashed rgba(254,202,87,.9)}
.mvbtn{width:58px;height:44px;font-size:20px;border-radius:12px;border:none;background:rgba(255,255,255,.12);cursor:pointer;transition:.15s}
.mvbtn:hover{background:#54a0ff;transform:scale(1.08)}
.symcard{width:108px;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;transition:.15s;user-select:none}
.symcard.sel{border-color:#feca57;background:rgba(254,202,87,.18)!important}
/* 数字点选 & 分桶 */
.nums{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.numc{min-width:54px;height:54px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.16);font-size:24px;font-weight:800;font-family:Consolas,monospace;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.numc:hover{border-color:#7bed9f;transform:translateY(-2px)}
.numc.sel{background:linear-gradient(135deg,#feca57,#ff9f43);border-color:#feca57;color:#5f27cd}
.numc.off{background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.12);color:#57606f;text-decoration:line-through;position:relative}
.numc.off:after{content:"✖";position:absolute;top:-8px;right:-6px;background:#ff6b6b;color:#fff;font-size:11px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:sans-serif}
.bins3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.binbox{background:rgba(0,0,0,.25);border:2px dashed rgba(255,255,255,.22);border-radius:14px;padding:9px;min-height:104px}
.binbox.hot{border-color:#feca57;background:rgba(254,202,87,.1)}
.binbox h4{font-size:14px;text-align:center;margin-bottom:8px;color:#feca57}
.binbox .chip{margin:4px auto}
.tray{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;min-height:58px;padding:10px;background:rgba(255,255,255,.04);border-radius:14px;margin:10px 0}
.chip{min-width:48px;height:42px;padding:0 10px;border-radius:11px;background:linear-gradient(135deg,#54a0ff,#5f27cd);font-size:19px;font-weight:800;font-family:Consolas,monospace;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;border:2px solid transparent;white-space:nowrap}
.chip.sel{border-color:#feca57;box-shadow:0 0 12px rgba(254,202,87,.7);transform:translateY(-3px)}
.chip.inbin{background:rgba(123,237,159,.25);border-color:rgba(123,237,159,.5);min-width:40px;height:36px;font-size:16px}
/* 分数涂色 */
.fgoal{text-align:center;font-size:22px;font-weight:800;color:#feca57;margin:8px 0}
.fboard{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px 0}
.fboard .fcell{width:46px;height:56px;border-radius:8px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);cursor:pointer;transition:.15s}
.fboard .fcell.on{background:linear-gradient(160deg,#7bed9f,#2ecc71);border-color:#7bed9f;box-shadow:0 0 10px rgba(123,237,159,.6)}
.fboard svg{overflow:visible}
.fboard .fp{cursor:pointer;transition:.15s}
.fboard .fp:hover{opacity:.75}
/* 配对 */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mcard{padding:12px 6px;border-radius:12px;background:linear-gradient(135deg,#54a0ff,#5f27cd);text-align:center;font-size:21px;font-weight:800;cursor:pointer;border:2px solid transparent;transition:.15s;font-family:Consolas,monospace}
.mcard.sel{border-color:#feca57;box-shadow:0 0 12px rgba(254,202,87,.7);transform:scale(1.05)}
.mcard.done{background:linear-gradient(135deg,#2ecc71,#27ae60);cursor:default;opacity:.85}
/* 分数键盘 */
.fslots{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}
.fslot{width:92px;height:64px;border-radius:14px;border:3px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;font-family:Consolas,monospace;cursor:pointer}
.fslot.sel{border-color:#feca57;box-shadow:0 0 12px rgba(254,202,87,.6)}
.fslash{font-size:40px;font-weight:800;color:#feca57}
/* 排序 */
.oboard{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.ocard{min-width:64px;padding:12px 8px;border-radius:13px;background:linear-gradient(135deg,#f368e0,#8e44ad);font-size:23px;font-weight:800;text-align:center;cursor:pointer;transition:.15s;font-family:Consolas,monospace;border:2px solid transparent}

/* 讲解动画用：方阵点阵 & 小正方形拼长方形 */
function gridSvg(cols,rows){
 const u=16,g=2,w=cols*u+(cols-1)*g,h=rows*u+(rows-1)*g;
 let r="";
 for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)r+=`<rect x="${j*(u+g)}" y="${i*(u+g)}" width="${u}" height="${u}" rx="3" fill="rgba(123,237,159,.55)" stroke="#7bed9f" stroke-width="1"/>`;
 return `<g>${r}</g>`;
}
function rectSvg(cols,rows,x,y){
 const u=9,g=1.5,w=cols*u+(cols-1)*g,h=rows*u+(rows-1)*g;
 let r="";
 for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)r+=`<rect x="${x+j*(u+g)}" y="${y+i*(u+g)}" width="${u}" height="${u}" rx="1.5" fill="rgba(84,160,255,.5)" stroke="#74b9ff" stroke-width="1"/>`;
 return `<g>${r}<rect x="${x-2}" y="${y-2}" width="${w+4}" height="${h+4}" rx="3" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="4 3"/></g>`;
}
/* 多边形 / 网格背景 */
function polySvg(pts,color){
 return `<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="${color||'rgba(84,160,255,.5)'}" stroke="#74b9ff" stroke-width="1.5"/>`;
}
function gridBgSvg(w,h,cs){
 let r="";
 for(let i=0;i<=w;i++)r+=`<line x1="${i*cs}" y1="0" x2="${i*cs}" y2="${h*cs}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
 for(let i=0;i<=h;i++)r+=`<line x1="0" y1="${i*cs}" x2="${w*cs}" y2="${i*cs}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
 return r;
}
/* 底（金色）+ 高（绿色虚线）标注的图形 */
function paraSvg(h,base,skew,offX,offY){
 offX=offX||0;offY=offY||0;
 const yT=offY,yB=offY+h;
 const pts=[[offX+skew,yT],[offX+base+skew,yT],[offX+base,yB],[offX,yB]];
 return `<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="rgba(84,160,255,.4)" stroke="#74b9ff" stroke-width="2"/>
  <line x1="${offX}" y1="${yB}" x2="${offX+base}" y2="${yB}" stroke="#feca57" stroke-width="3"/>
  <line x1="${offX+skew}" y1="${yT}" x2="${offX+skew}" y2="${yB}" stroke="#7bed9f" stroke-width="2" stroke-dasharray="5 4"/>`;
}
function triSvg(base,h,apexOffset,offX,offY,flip){
 offX=offX||0;offY=offY||0;
 const yB=offY+h,ax=offX+base/2+apexOffset*(flip?-1:1);
 const pts=[[offX,yB],[offX+base,yB],[ax,offY]];
 const footX=ax;
 return `<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="rgba(84,160,255,.4)" stroke="#74b9ff" stroke-width="2"/>
  <line x1="${offX}" y1="${yB}" x2="${offX+base}" y2="${yB}" stroke="#feca57" stroke-width="3"/>
  <line x1="${footX}" y1="${offY}" x2="${footX}" y2="${yB}" stroke="#7bed9f" stroke-width="2" stroke-dasharray="5 4"/>`;
}
function trapSvg(top,bottom,h,offX,offY,flip){
 offX=offX||0;offY=offY||0;
 const yB=offY+h,dx=(bottom-top)/2;
 const pts=[[offX+dx,offY],[offX+dx+top,offY],[offX+bottom,yB],[offX,yB]];
 if(flip){const t=pts.map(p=>[p[0],yB-(p[1]-offY)]);return `<polygon points="${t.map(p=>p.join(",")).join(" ")}" fill="rgba(84,160,255,.4)" stroke="#74b9ff" stroke-width="2"/>`;}
 const cx=offX+bottom/2;
 return `<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="rgba(84,160,255,.4)" stroke="#74b9ff" stroke-width="2"/>
  <line x1="${offX}" y1="${yB}" x2="${offX+bottom}" y2="${yB}" stroke="#feca57" stroke-width="3"/>
  <line x1="${cx}" y1="${offY}" x2="${cx}" y2="${yB}" stroke="#7bed9f" stroke-width="2" stroke-dasharray="5 4"/>`;
}
/* 分数条 / 圆形分饼 */
function barSvg(n,m,x,y,w,h){
 x=x||20;y=y||10;w=w||200;h=h||40;
 const sw=w/n;let r="";
 for(let i=0;i<n;i++){
  const on=i<m;
  r+=`<rect x="${x+i*sw+1}" y="${y}" width="${sw-2}" height="${h}" rx="3" fill="${on?'rgba(123,237,159,.65)':'rgba(255,255,255,.1)'}" stroke="${on?'#7bed9f':'rgba(255,255,255,.3)'}" stroke-width="1.2"/>`;
 }
 return `<g>${r}</g>`;
}
function sectorPath(cx,cy,r,a0,a1){
 const rad=a=>a*Math.PI/180;
 const x0=cx+r*Math.cos(rad(a0)),y0=cy+r*Math.sin(rad(a0));
 const x1=cx+r*Math.cos(rad(a1)),y1=cy+r*Math.sin(rad(a1));
 const large=(a1-a0)>180?1:0;
 return `M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z`;
}
function circleSvg(n,m,cx,cy,r){
 cx=cx||50;cy=cy||50;r=r||42;
 const step=360/n,start=-90;let s="";
 for(let i=0;i<n;i++){
  const on=i<m;
  s+=`<path d="${sectorPath(cx,cy,r,start+i*step+0.8,start+(i+1)*step-0.8)}" fill="${on?'rgba(254,202,87,.6)':'rgba(255,255,255,.1)'}" stroke="${on?'#feca57':'rgba(255,255,255,.4)'}" stroke-width="1.2"/>`;
 }
 return `<g>${s}<circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/></g>`;
}

  {h:"<div class='a-up' style='font-size:18px'>😲 咦，怎么一直除不完？</div><div class='vdiv a-pop' style='animation-delay:.5s;margin-top:12px'><div class='row q'><span class='c'>2</span><span class='c'>4</span><span class='c'>.</span><span class='c hlc'>3</span><span class='c hlc'>3</span><span class='c hlc'>3</span><span class='c'>…</span></div><div class='row'><span class='c'>3</span><span class='c' style='border-left:3px solid #feca57'>7</span><span class='c'>3</span></div></div><div class='a-up' style='animation-delay:1.4s;margin-top:10px;font-size:16px'>余数总是 <b style='color:#feca57'>1</b>，商的小数部分总是重复出现 <b style='color:#feca57'>3</b>！</div>",d:6},
  {h:"<div class='a-up' style='font-size:18px'>🌀 这就是「循环小数」</div><div class='a-up tipbox' style='animation-delay:.5s;margin-top:12px;font-size:15px'>小数部分从某一位起，<b>一个或几个数字依次不断重复出现</b>，这样的小数叫循环小数。重复出现的数字叫<b>循环节</b>。</div><div class='a-up eq' style='animation-delay:1.4s;margin-top:12px'>24.333… = 24.<span class='ok'>3̇</span></div><div class='a-up' style='animation-delay:2s;font-size:14px'>在循环节「3」上面点个小圆点，多省事！</div>",d:6.5},
  {h:"<div class='a-up' style='font-size:18px'>🔍 再看一个</div><div class='a-up eq' style='animation-delay:.5s;margin-top:12px'>9.4 ÷ 11 = 0.8<span class='hl'>5454</span>…</div><div class='a-up' style='animation-delay:1.2s;margin-top:10px;font-size:16px'>「54」两个数字在不断重复 → 循环节是 <b style='color:#feca57'>54</b></div><div class='a-pop tipbox' style='animation-delay:1.9s;margin-top:12px;font-size:16px'>口诀：除不尽别害怕，<br>找到重复的数字，它就是<b>循环节</b>！</div>",d:6}],

  {type:"choice",q:"下面哪个数是循环小数？",opts:["3.14159","2.7272…","0.5"],a:1,why:"2.7272…中「72」不断重复；3.14159是有限小数，0.5也是"}],

 {t:"调查“生活垃圾”",sub:"小数四则混合运算",scenes:[
  {h:"<div class='a-up' style='font-size:20px'>🗑️ 环保小调查</div><div class='a-up' style='animation-delay:.4s;font-size:17px;margin-top:14px;line-height:2'>小明家 4 周一共产生厨余垃圾 <b style='color:#feca57'>30.8千克</b><br>平均<b>每天</b>产生多少千克？（1周 = 7天）</div>",d:5.5},
  {h:"<div class='a-up' style='font-size:18px'>🧭 方法一：连除（从左往右算）</div><div class='a-up eq' style='animation-delay:.5s;margin-top:12px'>30.8 ÷ 4 ÷ 7</div><div class='a-up eq' style='animation-delay:1.1s;margin-top:8px'>= 7.7 ÷ 7 = <span class='ok'>1.1</span></div><div class='a-up' style='animation-delay:1.8s;margin-top:12px;font-size:18px'>🧭 方法二：先算总天数（有括号先算括号）</div><div class='a-up eq' style='animation-delay:2.4s;margin-top:8px'>30.8 ÷ (4 × 7) = 30.8 ÷ 28 = <span class='ok'>1.1</span></div>",d:7},
  {h:"<div class='a-up' style='font-size:18px'>📏 运算顺序（和整数一样！）</div><div class='a-pop tipbox' style='animation-delay:.5s;margin-top:14px;font-size:16px'>① 只有乘除或只有加减 → <b>从左往右</b>算<br>② 既有乘除又有加减 → 先<b>乘除</b>后<b>加减</b><br>③ 有括号 → 先算<b>括号里面</b>的</div>",d:6},
  {h:"<div class='a-up' style='font-size:18px'>✍️ 练一练</div><div class='a-up eq' style='animation-delay:.5s;margin-top:12px'>8.4 ÷ (0.7 × 2)</div><div class='a-up eq' style='animation-delay:1.2s;margin-top:8px'>= 8.4 ÷ <span class='hl'>1.4</span></div><div class='a-up eq' style='animation-delay:1.9s;margin-top:8px'>= <span class='ok'>6</span></div><div class='a-up' style='animation-delay:2.5s;margin-top:10px;font-size:15px'>先算括号里的乘法，再算除法 ✅</div>",d:6}],

  {type:"choice",q:"30.8 ÷ 4 ÷ 7 = ？",opts:["1.1","7.7","4.4"],a:0,why:"从左往右：30.8÷4=7.7，7.7÷7=1.1"},
  {type:"choice",q:"计算 9.6 ÷ (1.6 × 2) 时，先算哪一步？",opts:["9.6÷1.6","括号里的 1.6×2","随便先算哪个"],a:1,why:"有括号先算括号里面的"},

 ]},
{id:2,name:"轴对称和平移",icon:"🦋",color:"#EE5A6F",open:true,
 outline:"① 认识轴对称图形：沿一条直线对折后两边完全重合，这条直线叫对称轴；② 常见图形的对称轴条数（长方形2、正方形4、等边三角形3、圆无数条），注意平行四边形不是轴对称图形；③ 在方格纸上用「找关键点→数格子定对应点→连线」补全轴对称图形；④ 平移两要素是方向和距离，形状大小方向不变；⑤ 运用轴对称和平移欣赏、设计图案。",
 lessons:[
 {t:"轴对称再认识（一）",sub:"认识轴对称图形和对称轴",scenes:[
  {h:"<div class='a-up' style='font-size:20px'>🦋 大自然中的数学</div><div style='margin-top:10px;font-size:64px' class='a-pop'>🦋</div><div class='a-up' style='animation-delay:.7s;font-size:17px;margin-top:8px;line-height:2'>把一只蝴蝶从中间<b style='color:#feca57'>对折</b>，左右两边会怎样？</div><div class='a-up tipbox' style='animation-delay:1.4s;font-size:16px'>两边<b>完全重合</b>！树叶、天安门、剪纸里都藏着这个秘密</div>",d:6},
  {h:"<div class='a-up' style='font-size:19px'>📏 什么是轴对称图形</div><div class='a-up tipbox' style='animation-delay:.5s;margin-top:12px;font-size:16px'>一个图形沿<b>一条直线</b>对折，直线两边的部分能够<b style='color:#feca57'>完全重合</b>，<br>这个图形就是<b>轴对称图形</b>，<br>折痕所在的直线叫作<b>对称轴</b>（画成点划线 ┍ · · ┙）</div><svg class='a-pop' style='animation-delay:1.2s;margin-top:10px' width='120' height='70' viewBox='0 0 120 70'><path d='M60 6 L100 58 L20 58 Z' fill='rgba(84,160,255,.35)' stroke='#74b9ff' stroke-width='2'/><line x1='60' y1='4' x2='60' y2='62' stroke='#feca57' stroke-width='2.5' stroke-dasharray='7 5'/></svg>",d:7},
  {h:"<div class='a-up' style='font-size:19px'>⚠️ 最容易踩的坑：平行四边形</div><svg width='240' height='90' viewBox='0 0 240 90' style='margin-top:8px'><path d='M70 14 H150 L135 72 H55 Z' fill='rgba(255,107,107,.3)' stroke='#ff6b6b' stroke-width='2'/><line x1='105' y1='8' x2='105' y2='80' stroke='#ff6b6b' stroke-width='2' stroke-dasharray='6 4'/><text x='180' y='40' fill='#ff6b6b' font-size='34'>✘</text><text x='160' y='72' fill='#ff6b6b' font-size='14'>怎么折都不重合</text></svg><div class='a-up tipbox' style='animation-delay:.9s;font-size:16px'>平行四边形<b style='color:#ff6b6b'>不是</b>轴对称图形！<br>斜着的部分折过去对不齐，可别被它「左右一样长」骗啦</div>",d:7},
  {h:"<div class='a-up' style='font-size:19px'>🔢 对称轴有几条？</div><div class='a-up' style='animation-delay:.4s;margin-top:10px;font-size:16px;line-height:2'>等腰三角形 <b style='color:#feca57'>1</b> 条　·　等边三角形 <b style='color:#feca57'>3</b> 条<br>长方形 <b style='color:#feca57'>2</b> 条　·　正方形 <b style='color:#feca57'>4</b> 条<br>圆有 <b style='color:#feca57'>无数条</b>（每条过圆心的直线都是）</div><div class='a-pop tipbox' style='animation-delay:1.2s;font-size:16px'>口诀：先对折，看重合；<br>折痕就是对称轴，平行四边形要排除！</div>",d:6.5}],

 {t:"轴对称再认识（二）",sub:"在方格纸上补全轴对称图形",scenes:[
  {h:"<div class='a-up' style='font-size:20px'>🏠 小房子只有一半</div><div class='a-up' style='animation-delay:.4s;font-size:17px;margin-top:10px'>方格纸上有半座小房子和一条对称轴<br>怎样画出另一半，让它变成完整的轴对称图形？</div><svg class='a-pop' style='animation-delay:1s;margin-top:8px' width='170' height='110' viewBox='0 0 170 110'><g fill='rgba(84,160,255,.4)' stroke='#74b9ff'><rect x='30' y='30' width='40' height='60'/></g><line x1='85' y1='8' x2='85' y2='102' stroke='#feca57' stroke-width='2.5' stroke-dasharray='7 5'/></svg>",d:6.5},
  {h:"<div class='a-up' style='font-size:18px'>第①步：找关键点</div><div class='a-up tipbox' style='animation-delay:.5s;margin-top:10px;font-size:16px'>图形的<b>顶点、转折点</b>就是关键点，<br>把它们一个一个找出来并做上记号</div><svg style='margin-top:8px' width='170' height='110' viewBox='0 0 170 110'><g fill='rgba(84,160,255,.35)' stroke='#74b9ff'><rect x='30' y='30' width='40' height='60'/></g><circle cx='70' cy='30' r='5' fill='#ff6b6b'/><circle cx='70' cy='90' r='5' fill='#ff6b6b'/><circle cx='30' cy='30' r='5' fill='#ff6b6b'/><circle cx='30' cy='90' r='5' fill='#ff6b6b'/><line x1='85' y1='8' x2='85' y2='102' stroke='#feca57' stroke-width='2.5' stroke-dasharray='7 5'/></svg>",d:6},
  {h:"<div class='a-up' style='font-size:18px'>第②③步：数格子 → 连一连</div><div class='a-up tipbox' style='animation-delay:.4s;font-size:16px'>关键点到轴有几格，<br>就在轴的<b style='color:#feca57'>另一侧同样几格</b>处点出对应点<br>最后按顺序把对应点<b>连起来</b></div><div class='a-up eq' style='animation-delay:1.2s;margin-top:8px;font-size:26px'>距轴 2 格 ⇒ 对面也 2 格</div><div class='a-up' style='animation-delay:1.8s;font-size:15px'>对应点的连线和对称轴互相垂直哦</div>",d:7},
  {h:"<div class='a-up' style='font-size:19px'>✅ 画完要检验</div><div class='a-pop tipbox' style='animation-delay:.4s;margin-top:12px;font-size:16px'>闭上眼睛沿轴「折一折」：<br>两边每个点、每条边都能<b>完全重合</b>，就画对啦！</div><div style='margin-top:8px;font-size:52px' class='a-up'>🦋✨</div>",d:5}],

 {t:"平移",sub:"图形平移的方向和距离",scenes:[
  {h:"<div class='a-up' style='font-size:20px'>🚡 生活中的平移</div><div style='font-size:48px;margin-top:8px' class='a-pop'>🚡　🛗　🚪</div><div class='a-up tipbox' style='animation-delay:.8s;font-size:16px;margin-top:8px'>缆车滑行、电梯升降、推拉窗户……<br>物体沿<b>直线</b>运动，本身的<b>方向不改变</b>，这就是<b>平移</b></div>",d:6},
  {h:"<div class='a-up' style='font-size:19px'>🧭 平移两要素</div><div class='a-up eq' style='animation-delay:.5s;margin-top:12px;font-size:30px'>方向 <span class='hl'>+</span> 距离</div><div class='a-up' style='animation-delay:1.2s;margin-top:10px;font-size:16px'>要说清楚：向<b style='color:#feca57'>哪个方向</b>（上/下/左/右）、平移<b style='color:#feca57'>几格</b></div><svg class='a-pop' style='animation-delay:1.8s' width='230' height='70' viewBox='0 0 230 70'><rect x='10' y='18' width='34' height='34' rx='4' fill='rgba(123,237,159,.4)' stroke='#7bed9f'/><rect x='150' y='18' width='34' height='34' rx='4' fill='rgba(254,202,87,.5)' stroke='#feca57'/><line x1='48' y1='35' x2='146' y2='35' stroke='#fff' stroke-width='2' marker-end='url(#a)'/><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0 0 L6 3 L0 6 Z' fill='#fff'/></marker></defs><text x='78' y='26' fill='#feca57' font-size='15'>向右4格</text></svg>",d:7},
  {h:"<div class='a-up' style='font-size:18px'>🔢 数格数的正确方法</div><div class='a-up tipbox' style='animation-delay:.5s;margin-top:10px;font-size:16px'>找<b>同一组对应点</b>（比如同一个顶点），<br>数它移动后到新位置之间有几格</div><div class='a-up' style='animation-delay:1.3s;font-size:16px;color:#ff6b6b'>✘ 不要去数两个图形「中间空了几格」，那样会数错！</div>",d:6},
  {h:"<div class='a-up' style='font-size:19px'>📝 方格纸上画平移</div><div class='a-pop tipbox' style='animation-delay:.4s;margin-top:10px;font-size:16px'>① 找出图形的关键点<br>② 每个点都按方向移<b>同样多格</b><br>③ 顺次连接各点</div><div class='a-up eq' style='animation-delay:1.2s;margin-top:10px;font-size:24px'>形状、大小、方向都不变，<span class='ok'>只有位置变</span></div>",d:6.5}],

/* 游戏：小数点搬家 */
function runShift(st,item,g){
 const a=item[0],b=item[1],ans=item[2];
 const bDec=(b.split(".")[1]||"").length;
 let shifts=0;
 st.innerHTML=`<div style="text-align:center;font-size:13px;opacity:.7;margin-bottom:10px">第 ${GM.i+1} / ${GM.pool.length} 关</div>
 <div class="eq" style="text-align:center;display:table;margin:14px auto" id="shiftEq"></div>
 <div class="btn-row"><button class="mini-btn" id="shL">← 左移</button><button class="mini-btn" id="shR">右移 →</button></div>
 <div class="qfeed" id="shFeed" style="text-align:center"></div><div id="shiftKp"></div>`;
 function shifted(numStr,n){
  const neg=numStr.startsWith("-");let s=neg?numStr.slice(1):numStr;
  let dec=(s.split(".")[1]||"").length;let digits=s.replace(".","");
  let pos=digits.length-dec+n;
  while(pos>digits.length)digits+="0";
  while(pos<1){digits="0"+digits;pos++}
  let out=digits.slice(0,pos)+"."+digits.slice(pos);
  let ip=out.split(".")[0].replace(/^0+(?=.)/,"");
  out=ip+(out.includes(".")?"."+out.split(".")[1]:"");
  out=out.replace(/\.$/,"");
  return (neg?"-":"")+out;
 }
 function draw(){
  const na=shifted(a,shifts),nb=shifted(b,shifts);
  document.getElementById("shiftEq").innerHTML=`${na} ÷ ${nb} = ?`;
  const f=document.getElementById("shFeed");
  if(shifts===bDec){
   f.className="qfeed ok";f.textContent="✅ 除数变成整数啦！快算一算";
   document.getElementById("shR").disabled=true;
   if(!document.getElementById("kpbox")){
    document.getElementById("shiftKp").innerHTML="<div id='kpbox'></div>";
    mountKeypad("kpbox",ans,()=>{GM.score++;GM.i++;runGameRound()});
   }
  }else if(shifts<bDec){f.className="qfeed";f.style.color="#feca57";f.textContent=`除数还是小数，继续右移（还差 ${bDec-shifts} 位）`}
  else{f.className="qfeed no";f.textContent="移过头啦，往左移回来"}
 }
 document.getElementById("shR").onclick=()=>{if(shifts<bDec){shifts++;draw()}};
 document.getElementById("shL").onclick=()=>{if(shifts>0){shifts--;draw()}};
 draw();
}

/* 游戏：看图算面积 */
function calcFigSvg(shape,a,b,h){
 const cs=5,W=260,H=190;
 const bw=b*cs,bh=h*cs;
 const cx=W/2,baseY=H-35;
 let fig="",label="";
 if(shape==="para"){
  const sk=25;
  const x1=cx-bw/2+sk,y1=baseY-bh,x2=cx+bw/2+sk,x3=cx+bw/2,x4=cx-bw/2;
  fig=`<polygon points="${x1},${y1} ${x2},${y1} ${x3},${baseY} ${x4},${baseY}" fill="rgba(84,160,255,.4)" stroke="#74b9ff" stroke-width="2"/>
   <line x1="${x1}" y1="${y1}" x2="${x1}" y2="${baseY}" stroke="#7bed9f" stroke-width="2" stroke-dasharray="5 4"/>`;
  label=`<text x="${cx}" y="${baseY+18}" fill="#7bed9f" font-size="14" text-anchor="middle">底 ${b}cm</text>
   <text x="${x1-8}" y="${(y1+baseY)/2}" fill="#feca57" font-size="14" text-anchor="end">高 ${h}cm</text>`;
 }else if(shape==="tri"){
  const x1=cx-bw/2,x2=cx+bw/2,apex=cx-12,apexy=baseY-bh;
  fig=`<polygon points="${x1},${baseY} ${x2},${baseY} ${apex},${apexy}" fill="rgba(84,160,255,.4)" stroke="#74b9ff" stroke-width="2"/>
   <line x1="${apex}" y1="${apexy}" x2="${apex}" y2="${baseY}" stroke="#7bed9f" stroke-width="2" stroke-dasharray="5 4"/>`;
  label=`<text x="${cx}" y="${baseY+18}" fill="#7bed9f" font-size="14" text-anchor="middle">底 ${b}cm</text>
   <text x="${apex-6}" y="${(apexy+baseY)/2}" fill="#feca57" font-size="14" text-anchor="end">高 ${h}cm</text>`;
 }else if(shape==="trap"){
  const tw=a*cs;
  const x1=cx-tw/2,y1=baseY-bh,x2=cx+tw/2,x3=cx+bw/2,x4=cx-bw/2;
  fig=`<polygon points="${x1},${y1} ${x2},${y1} ${x3},${baseY} ${x4},${baseY}" fill="rgba(84,160,255,.4)" stroke="#74b9ff" stroke-width="2"/>
   <line x1="${cx}" y1="${y1}" x2="${cx}" y2="${baseY}" stroke="#7bed9f" stroke-width="2" stroke-dasharray="5 4"/>`;
  label=`<text x="${cx}" y="${y1-6}" fill="#7bed9f" font-size="13" text-anchor="middle">上底 ${a}cm</text>
   <text x="${cx}" y="${baseY+18}" fill="#7bed9f" font-size="14" text-anchor="middle">下底 ${b}cm</text>
   <text x="${cx+8}" y="${(y1+baseY)/2}" fill="#feca57" font-size="14" text-anchor="start">高 ${h}cm</text>`;
 }
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${fig}${label}</svg>`;
}

function runEst(st,item){
 const w=7,h=5,cs=28;
 const N=w*h,idx=[];
 for(let i=0;i<N;i++)idx.push(i);
 let seed=item.f*131+item.p*17+7;
 for(let i=N-1;i>0;i--){
  seed=(seed*1103515245+12345)&0x7fffffff;
  const j=seed%(i+1);
  const t=idx[i];idx[i]=idx[j];idx[j]=t;
 }
 const full=new Set(idx.slice(0,item.f));
 const part=new Set(idx.slice(item.f,item.f+item.p));
 let cells="";
 for(let r=0;r<h;r++)for(let c=0;c<w;c++){
  const k=r*w+c;
  const fill=full.has(k)?"rgba(123,237,159,.65)":part.has(k)?"rgba(254,202,87,.5)":"rgba(255,255,255,.04)";
  const stroke=full.has(k)?"#7bed9f":part.has(k)?"#feca57":"rgba(255,255,255,.15)";
  cells+=`<rect x="${c*cs+1}" y="${r*cs+1}" width="${cs-2}" height="${cs-2}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
  if(part.has(k))cells+=`<text x="${c*cs+cs/2}" y="${r*cs+cs/2+5}" fill="#8a6d00" font-size="15" font-weight="800" text-anchor="middle">半</text>`;
 }
 const ans=String(item.f+item.p/2);
 st.innerHTML=`<div style="text-align:center;font-size:13px;opacity:.7;margin-bottom:6px">第 ${GM.i+1} / ${GM.pool.length} 关 · 绿=满格(1格)，黄=不满格(半格)</div>
 <div style="display:flex;justify-content:center;margin:6px 0"><svg width="${w*cs}" height="${h*cs}" viewBox="0 0 ${w*cs} ${h*cs}">${cells}</svg></div>
 <div class="eq" style="text-align:center;margin:6px auto;display:table">面积大约 = <span class="hl">?</span> 格</div>
 <div id="kpbox"></div>`;
 let passed=false;
 mountKeypad("kpbox",ans,()=>{if(!passed){passed=true;const f=document.createElement("div");f.className="qfeed ok";f.style.textAlign="center";f.textContent="🎉 估算正确！满格 "+item.f+" + 半格 "+item.p+"÷2 = "+ans+" 格";st.appendChild(f);GM.score++;setTimeout(()=>{GM.i++;runGameRound()},1400)}});
}
/* 游戏：摸球猜可能 */
function runProb(st,item){
 const col={red:"#ff6b6b",yellow:"#feca57",blue:"#54a0ff",green:"#7bed9f"};
 let all=[];
 item.balls.forEach(([c,n])=>{for(let i=0;i<n;i++)all.push(c)});
 all.sort(()=>Math.random()-0.5);
 let balls="";
 all.forEach((c,i)=>{
  const row=Math.floor(i/5),p=i%5;
  balls+=`<circle cx="${50+p*33}" cy="${42+row*34}" r="14" fill="${col[c]}" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/>`;
 });
 const rows=Math.ceil(all.length/5);
 st.innerHTML=`<div style="text-align:center;font-size:13px;opacity:.7;margin-bottom:6px">第 ${GM.i+1} / ${GM.pool.length} 关 · 数一数每种球的个数</div>
 <div style="display:flex;justify-content:center"><svg width="246" height="${52+rows*34}" viewBox="0 0 246 ${52+rows*34}">
 <path d="M22,18 L22,${34+rows*34} Q22,${44+rows*34} 34,${44+rows*34} L212,${44+rows*34} Q224,${44+rows*34} 224,${34+rows*34} L224,18" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
 ${balls}</svg></div>
 <div style="text-align:center;font-size:18px;margin:8px 0">摸出<b style="color:#feca57">哪种</b>球的可能性大？</div>
 <div class="btn-row" id="probRow">${item.opts.map((o,i)=>`<button class="mini-btn popt" data-i="${i}">${o}</button>`).join("")}</div>
 <div class="qfeed" id="probFeed" style="text-align:center"></div>`;
 let passed=false;
 st.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{
  const f=document.getElementById("probFeed");
  if(+b.dataset.i===item.a){
   if(passed)return;passed=true;
   f.className="qfeed ok";f.textContent="🎉 猜对啦！"+item.opts[item.a]+"数量占优势，摸到的可能性大！";GM.score++;
   setTimeout(()=>{GM.i++;runGameRound()},1100);
  }else{
   f.className="qfeed no";f.textContent="再数一数每种球的个数～";
   b.classList.add("a-shake");setTimeout(()=>b.classList.remove("a-shake"),500);
  }
 });
}
/* 游戏：找规律点下一项 */
function runSeq(st,item){
 st.innerHTML=`<div style="text-align:center;font-size:13px;opacity:.7;margin-bottom:6px">第 ${GM.i+1} / ${GM.pool.length} 关 · 先算相邻两数的差</div>
 <div class="oboard">${item.seq.map(n=>`<div class="ocard" style="cursor:default">${n}</div>`).join("")}<div class="ocard" style="background:rgba(255,255,255,.12);cursor:default">?</div></div>
 <div style="text-align:center;font-size:18px;margin:4px 0">下一个数是几？</div>
 <div class="btn-row" id="seqRow">${item.opts.map((o,i)=>`<button class="mini-btn popt" data-i="${i}">${o}</button>`).join("")}</div>
 <div class="qfeed" id="seqFeed" style="text-align:center"></div>`;
 let passed=false;
 st.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{
  const f=document.getElementById("seqFeed");
  if(+b.dataset.i===item.a){
   if(passed)return;passed=true;
   f.className="qfeed ok";f.textContent="🎉 规律找到了！下一个数是 "+item.opts[item.a];GM.score++;
   setTimeout(()=>{GM.i++;runGameRound()},1100);
  }else{
   f.className="qfeed no";f.textContent="不对哦，先算出相邻两数的差～";
   b.classList.add("a-shake");setTimeout(()=>b.classList.remove("a-shake"),500);
  }
 });
}
function settleView(){
 const {les}=LES;
 return `<div class="card"><div class="settle"><div class="cups">⭐⭐⭐</div><h2>「${les.t}」完成！</h2><p>📖 动画讲解 ✅　✏️ 小练习 ✅　🎮 闯关游戏 ✅</p><p style="margin-top:8px;color:#feca57;font-weight:700">获得三星徽章！</p>
 <div class="btn-row" style="margin-top:22px"><button class="mini-btn" onclick="LES.step='learn';renderStep()">🔁 再学一遍</button><button class="check-btn" onclick="backToUnit()">返回单元 →</button></div></div></div>`;
}
function finishLesson(){
 const k=lkey(LES.uid,LES.li);
 const st=ST[k]||{};st.stars=3;ST[k]=st;save();
 playScenesOff();confetti();
}
function playScenesOff(){window.sceneNav=()=>{};window.togglePlay=()=>{}}
function backToUnit(){playScenesOff();showUnit(LES.uid)}
function confetti(){
 const emos=["⭐","🎉","✨","🌟","🎊"];
 for(let i=0;i<26;i++){
  const d=document.createElement("div");d.className="confetti";d.textContent=emos[i%emos.length];
  d.style.left=Math.random()*100+"vw";d.style.animationDuration=(2+Math.random()*2)+"s";d.style.fontSize=(16+Math.random()*22)+"px";
  document.body.appendChild(d);setTimeout(()=>d.remove(),4500);
 }
}
/* 学习页进入时启动播放器 */
const _origRender=renderStep;
renderStep=function(){
 const step=LES.step;
 _origRender();
 if(step==="learn")playScenes();
};
showHome();
</script>
